<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="12" y1="8" x2="116" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#171d2c"/>
      <stop offset="100%" stop-color="#0b0e16"/>
    </linearGradient>
    <linearGradient id="rim" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5cc6fc" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#3186ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="arc" x1="28" y1="28" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5cc6fc"/>
      <stop offset="55%" stop-color="#3186ff"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="sweep" x1="64" y1="64" x2="102" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3186ff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#5cc6fc" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="64" cy="64" r="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3186ff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#3186ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bg)"/>
  <rect x="6.75" y="6.75" width="114.5" height="114.5" rx="27.25" stroke="url(#rim)" stroke-width="1.5"/>

  <circle cx="64" cy="64" r="38" fill="url(#glow)"/>

  <!-- Radar sweep sector -->
  <path d="M64 64 L64 26 A38 38 0 0 1 97.5 46 Z" fill="url(#sweep)"/>

  <!-- Concentric guard rings -->
  <circle cx="64" cy="64" r="38" stroke="#94a3b8" stroke-opacity="0.18" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="24" stroke="#94a3b8" stroke-opacity="0.22" stroke-width="1.3" stroke-dasharray="4 4"/>

  <!-- 80% threshold highlight arc -->
  <path d="M64 26 A38 38 0 1 1 28.4 77.2" stroke="url(#arc)" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Compass ticks -->
  <line x1="64" y1="18" x2="64" y2="23" stroke="#5cc6fc" stroke-width="2" stroke-linecap="round"/>
  <line x1="110" y1="64" x2="105" y2="64" stroke="#94a3b8" stroke-opacity="0.45" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="64" y1="110" x2="64" y2="105" stroke="#94a3b8" stroke-opacity="0.45" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="18" y1="64" x2="23" y2="64" stroke="#94a3b8" stroke-opacity="0.45" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Sentinel beacon needle -->
  <path d="M64 64 L91 41" stroke="#5cc6fc" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Threshold alert star node -->
  <circle cx="91" cy="41" r="5" fill="#f59e0b"/>
  <circle cx="91" cy="41" r="9" fill="#f59e0b" fill-opacity="0.22"/>

  <!-- Center core -->
  <circle cx="64" cy="64" r="7" fill="#0f172a" stroke="#5cc6fc" stroke-width="2.4"/>
  <circle cx="64" cy="64" r="2.6" fill="#eef1f7"/>
</svg>
