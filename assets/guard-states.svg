<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="232" viewBox="0 0 1120 232" fill="none">
  <rect x="1" y="1" width="358" height="230" rx="14" fill="#111622" stroke="#f59e0b" stroke-opacity="0.42" stroke-width="1.2"/>
